Object.keys(TN).slice(0,7).forEach(k=>{const c=document.createElement('button');c.className='t';c.dataset.tool=k;c.textContent=TN[k];c.onclick=()=>{setTool(k);$('opt').hidden=true};$('ot').appendChild(c)});
setTool(tool);
const items=[[()=>'Gravitasi: '+GN[gv===1?0:gv===-1?1:2],()=>{gv=gv===1?-1:gv===-1?0:1}],[()=>'Udara: '+(airOn?'Nyala':'Mati'),()=>{airOn=!airOn;if(!airOn)P.fill(0)}],[()=>'Panas: '+(heatOn?'Nyala':'Mati'),()=>{heatOn=!heatOn}],[()=>'Kuas: '+(sq?'Kotak':'Bulat'),()=>{sq=!sq}],[()=>'Kecepatan: '+SP[si]+'x',()=>{si=(si+1)%4}],[()=>'Hujan: '+(rain?'Nyala':'Mati'),()=>{rain=!rain}],[()=>'Angin: '+WN[wind===0?0:wind>0?1:2],()=>{wind=wind===0?1:wind===1?-1:0}],[()=>'Tampilan: '+DN[disp],()=>{disp=(disp+1)%3}],
[()=>'Reset tekanan',()=>{P.fill(0);pAct=0}],[()=>'Dinginkan semua',()=>{T.fill(22)}],[()=>'Guncang',()=>{snap();for(let r=0;r<3;r++){mv.fill(0);for(let i=0;i<g.length;i++){const t=g[i];if(!t||ST[t]||mv[i])continue;const x=i%W,y=i/W|0,a=x+(R()*3|0)-1,c=y+(R()*3|0)-1;if(a<0||c<0||a>=W||c>=H)continue;const j=c*W+a;if(!g[j])mvT(i,j)}}}],[()=>'Acak',()=>{snap();const ids=[];M.forEach((m,t)=>{if(t&&'SPLX'.includes(m[7]))ids.push(t)});for(let k=0;k<25;k++)put(R()*W|0,R()*H|0,2+R()*4|0,ids[R()*ids.length|0])}]];
items.forEach(([lb,fn])=>{const c=document.createElement('button');c.className='t';c.textContent=lb();c.onclick=()=>{fn();c.textContent=lb()};$('os').appendChild(c)});$('opt').hidden=false}
$('opt').onclick=e=>{if(e.target.id==='opt')$('opt').hidden=true};
// save / open
const enc=a=>{let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return s};
function saveSim(){const name=nm.value.trim()||'untitled',tb=new Uint8Array(g.length);for(let i=0;i<g.length;i++)tb[i]=Math.max(0,Math.min(255,Math.round((T[i]+200)/10)));
try{localStorage.setItem('sbx2_'+name,JSON.stringify({w:W,h:H,d:Date.now(),g:enc(g),c:enc(ct),t:enc(tb)}));toast('Tersimpan: '+name)}catch(e){toast('Gagal menyimpan')}}
function loadSim(k){try{const o=JSON.parse(localStorage.getItem(k));snap();g.fill(0);ct.fill(0);T.fill(22);P.fill(0);for(let y=0;y<Math.min(H,o.h);y++)for(let x=0;x<Math.min(W,o.w);x++){const s=(o.h-1-y)*o.w+x,i=(H-1-y)*W+x,v=o.g.charCodeAt(s);g[i]=v;ct[i]=o.c.charCodeAt(s);T[i]=o.t.charCodeAt(s)*10-200;lf[i]=lifeFor(v);sh[i]=R()*30|0;if(v===GOL)golN=1}nm.value=k.slice(5);toast('Dimuat: '+k.slice(5))}catch(e){toast('Gagal memuat')}}
function openDlg(){const b=$('db');b.innerHTML='<h4>BUKA SIMULASI</h4>';const ks=Object.keys(localStorage).filter(k=>k.startsWith('sbx2_'));if(!ks.length)b.insertAdjacentHTML('beforeend','<div style="color:#999;padding:8px">Belum ada simpanan. Isi nama lalu tekan tombol simpan.</div>');
ks.forEach(k=>{const r=document.createElement('div');r.className='sv';const a=document.createElement('button');a.className='t';a.textContent=k.slice(5);a.onclick=()=>{loadSim(k);$('dlg').hidden=true};const d=document.createElement('button');d.className='t x';d.textContent='Hapus';d.onclick=()=>{localStorage.removeItem(k);openDlg()};r.append(a,d);b.appendChild(r)});$('dlg').hidden=false}
$('dlg').onclick=e=>{if(e.target.id==='dlg')$('dlg').hidden=true};
// console
const co=$('co'),ci=$('ci');const clog=s=>{co.textContent+=s+'\n';co.scrollTop=1e5};
ci.onkeydown=e=>{if(e.key!=='Enter')return;const v=ci.value.trim();ci.value='';clog('> '+v);const a=v.split(/\s+/),c=a[0].toLowerCase(),id=E[(a[1]||'').toUpperCase()];
if(c==='help')clog('list | fill KODE | clear | temp N | tekanan N | tutup');
else if(c==='list')clog(M.slice(1).map(m=>m[0]).join(' '));
else if(c==='fill'&&id){snap();for(let i=0;i<g.length;i++)if(!g[i])mk(i,id)}
else if(c==='clear'){snap();g.fill(0);P.fill(0)}
else if(c==='temp'&&!isNaN(+a[1])){for(let i=0;i<g.length;i++)T[i]=+a[1]}
else if(c==='tekanan'&&!isNaN(+a[1])){P.fill(+a[1]);pAct=240}
else if(c==='tutup')$('con').hidden=true;
else clog('? ketik help')};
// loop
let fc=0,lt=performance.now(),fps=0,hl=0;
function hud(){const nm2=M[sel][1],c=M[sel][0];$('hud').textContent='TBox v3\n'+(sel?nm2+' ['+c+']':'Penghapus')+'  Kuas:'+rad+'\nPart:'+cnt+'  FPS:'+fps+(z>1.05?'  '+z.toFixed(1)+'x':'')+(paused?'  JEDA':'')+'\n'+DN[disp]+' | '+TN[tool];
if(hx>=0&&hy>=0&&hx<W&&hy<H){const i=hy*W+hx,t=g[i];$('hv').textContent=(t?M[t][1]:'Kosong')+(t?', Suhu: '+T[i].toFixed(1)+' C':'')+'\nTekanan: '+P[i].toFixed(2)+'  X:'+hx+' Y:'+hy}}
function loop(){requestAnimationFrame(loop);
try{if(down&&tool==='pen')put(lx,ly,rad,sel);const n0=performance.now();
if(!paused&&!document.hidden){acc=Math.min(acc+SP[si],6);while(acc>=1){step();acc--;if(performance.now()-n0>14){acc=0;break}}}else acc=0;
draw();fc++;const n=performance.now();if(n-lt>1000){fps=fc;fc=0;lt=n}if(n-hl>200){hl=n;hud()}}
catch(e){if(!paused){paused=true;setIc($('bp'),'play');toast('Error: '+e.message+' (dijeda)')}}}
window.onerror=m=>{toast('Error: '+m)};
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(resizeGrid,150)}).observe(vp);
resizeGrid();showCat('P');setTool('pen');requestAnimationFrame(loop);
</script></body></html>
